name: CI Build & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Next.js Build & Memory Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: therapy
          POSTGRES_USER: therapy
          POSTGRES_PASSWORD: therapy_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therapy -d therapy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://therapy:therapy_password@localhost:5432/therapy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Runtime Therapeutic Memory Smoke Test
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          npm start > /tmp/meine-kvt.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/memory > /tmp/memory-dashboard.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application or /api/memory did not become healthy"
            cat /tmp/meine-kvt.log
            exit 1
          fi

          grep -q '"embeddingMode"' /tmp/memory-dashboard.json
          grep -q '"counts"' /tmp/memory-dashboard.json

          curl --fail --silent --show-error \
            'http://127.0.0.1:3000/api/memory?q=Beziehung' \
            > /tmp/memory-search.json

          # CI intentionally has no OPENAI_API_KEY, so this also verifies the
          # deterministic lexical fallback path instead of only the embedding path.
          grep -q '"mode":"lexical"' /tmp/memory-search.json
          grep -q '"corrections"' /tmp/memory-search.json

          echo "Therapeutic Memory runtime smoke test passed"

      - name: Validate non-sensitive GitHub sync manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:status

          node <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync('sync-status.json', 'utf8'));

          const topKeys = Object.keys(status).sort();
          const expectedTop = ['database', 'generated_at', 'schema_version', 'state_hash'].sort();
          if (JSON.stringify(topKeys) !== JSON.stringify(expectedTop)) {
            throw new Error(`Unexpected top-level sync-status keys: ${topKeys.join(', ')}`);
          }

          const databaseKeys = Object.keys(status.database || {}).sort();
          const expectedDatabase = [
            'active_memory_count',
            'checkin_count',
            'completed_session_count',
            'last_checkin_at',
            'latest_memory_updated_at',
          ].sort();
          if (JSON.stringify(databaseKeys) !== JSON.stringify(expectedDatabase)) {
            throw new Error(`Unexpected database metadata keys: ${databaseKeys.join(', ')}`);
          }

          if (status.schema_version !== 1) throw new Error('Unexpected sync-status schema version');
          if (!status.generated_at || Number.isNaN(Date.parse(status.generated_at))) {
            throw new Error('generated_at must be an ISO timestamp');
          }
          if (!/^sha256:[0-9a-f]{64}$/.test(status.state_hash || '')) {
            throw new Error('state_hash must be a SHA-256 digest');
          }

          for (const key of ['checkin_count', 'active_memory_count', 'completed_session_count']) {
            if (!Number.isInteger(status.database[key]) || status.database[key] < 0) {
              throw new Error(`${key} must be a non-negative integer`);
            }
          }

          if (status.database.active_memory_count < 1) {
            throw new Error('Memory smoke test should have materialized at least one active memory');
          }
          if (status.database.completed_session_count < 1) {
            throw new Error('Focused-session imports should have materialized completed sessions');
          }

          const serialized = JSON.stringify(status).toLowerCase();
          const forbidden = [
            'mood', 'fulfillment', 'loneliness', 'inner_calm', 'joy', 'rumination',
            'future_anxiety', 'novelty_drive', 'energy', 'life_satisfaction', 'sleep_quality',
            'note', 'content', 'key_insight', 'key_observations', 'homework', 'message',
          ];
          for (const term of forbidden) {
            if (serialized.includes(term)) {
              throw new Error(`Sensitive field name leaked into sync-status.json: ${term}`);
            }
          }

          console.log('Non-sensitive sync manifest validation passed');
          NODE
