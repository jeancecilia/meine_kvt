name: CI Build & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Next.js Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Build
        run: npm run build
        env:
          DATABASE_URL: postgres://therapy:therapy_password@localhost:5432/therapy
          NODE_ENV: production
